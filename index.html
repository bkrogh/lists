<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f1f3f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#202124" media="(prefers-color-scheme: dark)" />
    <title>Lists</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23fbbc04'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' stroke='%23202124' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <main class="card">
      <header class="card-header">
        <input id="title" class="title" placeholder="Title" aria-label="List title" autocomplete="off" />
        <div class="actions">
          <button id="import-btn" class="btn" type="button">Import</button>
          <button id="export-btn" class="btn" type="button" title="Copy the list as Markdown">Copy</button>
        </div>
      </header>

      <ul id="active" class="list" aria-label="To do"></ul>

      <label class="add-row">
        <span class="plus" aria-hidden="true">+</span>
        <input id="add-input" placeholder="List item" aria-label="Add list item" autocomplete="off" />
      </label>

      <p id="empty-hint" class="hint">Type above, or paste a Markdown list from ChatGPT.</p>

      <section id="done-section" class="done-section">
        <div class="done-header">
          <button id="done-toggle" class="done-toggle" type="button" aria-expanded="true">
            <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5z" /></svg>
            <span id="done-count"></span>
          </button>
          <button id="clear-done" class="btn btn-quiet" type="button">Delete all</button>
        </div>
        <ul id="done" class="list" aria-label="Completed"></ul>
      </section>
    </main>

    <footer class="footer">Saved only in this browser. Ticked items delete themselves after 5 hours.</footer>

    <dialog id="import-dialog" class="dialog">
      <form method="dialog">
        <h2>Import Markdown list</h2>
        <p class="muted">Paste a list from ChatGPT or any Markdown. Headings become parent items, <code>[x]</code> items arrive ticked.</p>
        <textarea id="import-text" rows="12" placeholder="## Groceries&#10;- Milk&#10;- [ ] Eggs&#10;- **Bread**"></textarea>
        <div class="dialog-footer">
          <span id="import-count" class="muted"></span>
          <button value="cancel" class="btn" type="submit">Cancel</button>
          <button id="import-confirm" value="import" class="btn btn-primary" type="submit" disabled>Add items</button>
        </div>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite">
      <span id="toast-msg"></span>
      <button id="toast-undo" class="btn btn-quiet" type="button">Undo</button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
